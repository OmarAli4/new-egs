[providers]
providers = ["python"]

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["python -m pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --noinput"]

[start]
cmd = "bash -c 'python manage.py migrate --noinput && gunicorn service_bay.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --log-level debug --access-logfile - --error-logfile -'"
