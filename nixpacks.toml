[providers]
providers = ["python"]

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["python -m pip install -r requirements.txt"]

[start]
cmd = "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn service_bay.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 2 --timeout 60"
