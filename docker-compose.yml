version: '3.8'

services:
  web:
    build: .
    restart: always
    command: gunicorn service_bay.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2
    volumes:
      - static_volume:/app/staticfiles
    environment:
      - DJANGO_PRODUCTION=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-production-secure-random-key-egs-2026}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,egs-garage.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://egs-garage.com}
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  static_volume:
