                <circle cx="100" cy="79" r="6" fill="url(#wheelRim)"/>
                <line x1="100" y1="73" x2="100" y2="85" stroke="#94A3B8" stroke-width="1"/>
                <line x1="94" y1="79" x2="106" y2="79" stroke="#94A3B8" stroke-width="1"/>
                <line x1="96" y1="75" x2="104" y2="83" stroke="#94A3B8" stroke-width="0.8"/>
                <line x1="96" y1="83" x2="104" y2="75" stroke="#94A3B8" stroke-width="0.8"/>

            <!-- ============================================== -->
            <a href="tel:{{ site_settings.hotline_number|default:'01019900990' }}" style="pointer-events: auto; cursor: pointer;" class="tablet-click-area">
            <g class="tablet-device-group tablet-hover-fx" filter="drop-shadow(0 0 12px rgba(30, 96, 255, 0.4))">
                
                <!-- Rugged Titanium Armored Outer Chassis -->
                <rect x="133" y="6" width="174" height="40" rx="7" fill="#0B132B" stroke="#1E293B" stroke-width="2"/>

                <!-- 4 Heavy-Duty Armored Rubber Bumper Corners (Bosch Ruggedized Look) -->
                <!-- Top-Left Bumper -->
                <path d="M 133 14 L 133 10 C 133 8 135 6 137 6 L 143 6" stroke="#1E60FF" stroke-width="2.5" fill="none"/>
                <!-- Top-Right Bumper -->
                <path d="M 299 6 L 303 6 C 305 6 307 8 307 10 L 307 14" stroke="#1E60FF" stroke-width="2.5" fill="none"/>

                <path d="M 307 38 L 307 42 C 307 44 305 46 303 46 L 299 46" stroke="#1E60FF" stroke-width="2.5" fill="none"/>

<style>
/* CSS Keyframes for High-Performance Pure SVG Animation (60 FPS) */
@keyframes spinWheel {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes roadDashAnim {
    0% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -48; }
}

@keyframes vanMicroBounce {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-1.8px); }
}

@keyframes diagnosticWaveform {
    0%, 100% { opacity: 0.9; stroke: #10B981; filter: drop-shadow(0 0 2px #10B981); }
    50% { opacity: 0.45; stroke: #38BDF8; filter: drop-shadow(0 0 5px #38BDF8); }
}

@keyframes obdPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.3); }
}

@keyframes tabletGlowPulse {
    0%, 100% { opacity: 0.88; }
    50% { opacity: 1; }
}

@keyframes headlightPulse {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 0.5; }
}

.wheel-spin {
    animation: spinWheel 0.75s linear infinite;
}

.road-animated-dash {
    animation: roadDashAnim 0.75s linear infinite;
}

.van-chassis-bounce {
    animation: vanMicroBounce 1.4s ease-in-out infinite;
}

.tablet-device-group {
    animation: tabletGlowPulse 3s ease-in-out infinite;
}

.diagnostic-pulse-wave {
    animation: diagnosticWaveform 1.6s ease-in-out infinite;
}

.obd-pulse-dot {
    animation: obdPulse 1.1s ease-in-out infinite;
    transform-origin: 149.5px 30.5px;
}

.tablet-number-glow {
    filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 10px rgba(56, 189, 248, 0.65));
}

.headlight-pulse {
    animation: headlightPulse 2s ease-in-out infinite;
}

/* Shutter Door Smooth Transition */
.shutter-door-elem {
    transition: width 0.45s cubic-bezier(0.7, 0, 0.3, 1), x 0.45s cubic-bezier(0.7, 0, 0.3, 1);
}
.tablet-click-area:hover .tablet-hover-fx {
    transform: scale(1.02) translateY(-2px);
    filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.7));
}
.tablet-hover-fx {
    transition: all 0.3s ease-out;
    transform-origin: center right;
}
</style>

<script>
(function() {
    let isShutterRunning = false;

    function runTabletShutterSequence() {
        if (isShutterRunning) return;
        const leftDoor = document.getElementById('shutterDoorLeft');
        const rightDoor = document.getElementById('shutterDoorRight');
        const phoneElem = document.getElementById('tabletPhoneNumber');
        if (!leftDoor || !rightDoor || !phoneElem) return;

        isShutterRunning = true;

        // 1. Shutter doors slide closed to the center (meeting at x=220)
        leftDoor.setAttribute('width', '80');
        rightDoor.setAttribute('x', '220');
        rightDoor.setAttribute('width', '80');

        // 2. Behind closed doors: clear text
        setTimeout(() => {
            phoneElem.textContent = '';

            // 3. Open shutter doors back up
            setTimeout(() => {
                leftDoor.setAttribute('width', '0');
                rightDoor.setAttribute('x', '299');
                rightDoor.setAttribute('width', '0');

                // 4. Typewriter effect: write digits one by one
                setTimeout(() => {
                    const fullNumber = '{{ site_settings.hotline_number|default:"01019900990" }}';
                    let currentLength = 0;
                    const typeInterval = setInterval(() => {
                        currentLength++;
                        phoneElem.textContent = fullNumber.slice(0, currentLength);
                        if (currentLength >= fullNumber.length) {
                            clearInterval(typeInterval);
                            isShutterRunning = false;
                        }
                    }, 65); // 65ms per digit
                }, 400);

            }, 380);

        }, 420);
    }

    // Expose globally so splash loader can trigger it immediately
    window.runTabletShutterSequence = runTabletShutterSequence;

    // Trigger IMMEDIATELY when entering the site
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(runTabletShutterSequence, 300);
        });
    } else {
        setTimeout(runTabletShutterSequence, 300);
    }

    // Repeat every 30 seconds exactly as requested
    setInterval(runTabletShutterSequence, 30000);
})();
</script>
