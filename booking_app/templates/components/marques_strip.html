<!-- FULL-WIDTH TOP LUXURY MARQUES STRIP (Directly Under Header) -->
    <section class="top-marques-bar relative">
        <div class="top-marques-container relative">
            <div class="top-marques-label">
                <span>البرمجيات المعتمدة:</span>
            </div>
            <div class="absolute left-0 top-0 bottom-0 w-16 bg-gradient-to-r from-[#03060D] to-transparent pointer-events-none flex items-center justify-start pl-1 sm:hidden z-10 text-neutral-400">
                <i data-feather="chevron-left" class="w-5 h-5 animate-pulse opacity-70"></i>
            </div>
            <div class="top-marques-track">
                <!-- Mercedes-Benz -->
                <div class="marque-item">
                    <svg class="marque-svg" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="4"/>
                        <polygon points="50,14 47,48 50,50 53,48" fill="currentColor"/>
                        <polygon points="17,69 48,52 50,50 46,47" fill="currentColor"/>
                        <polygon points="83,69 52,52 50,50 54,47" fill="currentColor"/>
                        <line x1="50" y1="50" x2="50" y2="14" stroke="currentColor" stroke-width="3"/>
                        <line x1="50" y1="50" x2="17" y2="69" stroke="currentColor" stroke-width="3"/>
                        <line x1="50" y1="50" x2="83" y2="69" stroke="currentColor" stroke-width="3"/>
                    </svg>
                    <span>Mercedes-Benz</span>
                </div>

                <!-- BMW -->
                <div class="marque-item">
                    <svg class="marque-svg" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="4"/>
                        <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="2.5"/>
                        <path d="M 50 20 A 30 30 0 0 1 80 50 L 50 50 Z" fill="#0066FF"/>
                        <path d="M 20 50 A 30 30 0 0 1 50 80 L 50 50 Z" fill="#0066FF"/>

                        <line x1="20" y1="50" x2="80" y2="50" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span>BMW</span>
                </div>

                <!-- Porsche -->
                <div class="marque-item">
                    <svg class="marque-svg" viewBox="0 0 100 100">
                        <path d="M 30 18 L 70 18 C 72 18 75 35 75 52 C 75 74 50 86 50 86 C 50 86 25 74 25 52 C 25 35 28 18 30 18 Z" fill="none" stroke="currentColor" stroke-width="3.5"/>
                        <line x1="50" y1="18" x2="50" y2="86" stroke="currentColor" stroke-width="2"/>
                        <line x1="26" y1="46" x2="74" y2="46" stroke="currentColor" stroke-width="2"/>
                        <circle cx="50" cy="46" r="8" fill="#0066FF"/>
                    </svg>
                    <span>Porsche</span>
                </div>

                <!-- Audi -->
                <div class="marque-item">
                    <svg class="marque-svg" viewBox="0 0 100 100">
                        <circle cx="24" cy="50" r="16" fill="none" stroke="currentColor" stroke-width="3.5"/>
                        <circle cx="41" cy="50" r="16" fill="none" stroke="currentColor" stroke-width="3.5"/>
                        <circle cx="59" cy="50" r="16" fill="none" stroke="currentColor" stroke-width="3.5"/>
                        <circle cx="76" cy="50" r="16" fill="none" stroke="currentColor" stroke-width="3.5"/>
                    </svg>
                    <span>Audi</span>
                </div>

                <!-- Land Rover / Range Rover -->
                <div class="marque-item">
                    <svg class="marque-svg" viewBox="0 0 100 100">
                        <ellipse cx="50" cy="50" rx="44" ry="24" fill="none" stroke="currentColor" stroke-width="3.5"/>
                        <text x="50" y="55" font-family="'Outfit', 'Cairo', sans-serif" font-size="11" font-weight="900" letter-spacing="1" fill="currentColor" text-anchor="middle">ROVER</text>
                    </svg>
                    <span>Range Rover</span>
                </div>

                <!-- Lexus -->
                <div class="marque-item">
                    <svg class="marque-svg" viewBox="0 0 100 100">
                        <ellipse cx="50" cy="50" rx="42" ry="30" fill="none" stroke="currentColor" stroke-width="3.5"/>
                        <path d="M 68 34 L 38 66 L 64 66" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Lexus</span>
                </div>

                <!-- Volkswagen -->

                    <svg class="marque-svg" viewBox="0 0 100 100">

                    </svg>
                    <span>Volkswagen</span>
                </div>

                <!-- Toyota -->
                <div class="marque-item">
                    <svg class="marque-svg" viewBox="0 0 100 100">
                        <ellipse cx="50" cy="50" rx="44" ry="30" fill="none" stroke="currentColor" stroke-width="3.5"/>
                        <ellipse cx="50" cy="38" rx="26" ry="12" fill="none" stroke="currentColor" stroke-width="2.8"/>

                    </svg>
                    <span>Toyota</span>
                </div>

        </div>
    </section>
