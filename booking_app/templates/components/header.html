<!-- HEADER NAVIGATION BAR -->
    <header class="app-header">
        <div class="header-container">
            <a href="/" class="brand-logo" onclick="goToHomePage(event)" title="الرئيسية - EGS Elite Garage">
                <div class="egs-logo-badge">
                    <svg viewBox="0 0 240 120" class="h-14 sm:h-[84px] w-auto block">
                        <defs>
                            <linearGradient id="navGradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#00D2FF"/>
                                <stop offset="100%" stop-color="#0080FF"/>
                            </linearGradient>
                            <linearGradient id="navGradMid" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#0080FF"/>
                                <stop offset="100%" stop-color="#0055FF"/>
                            </linearGradient>
                            <linearGradient id="navGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#0066FF"/>
                                <stop offset="100%" stop-color="#003DBD"/>
                            </linearGradient>
                            <linearGradient id="navNeedleGrad" x1="0" y1="105" x2="0" y2="25" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#0055FF"/>
                                <stop offset="50%" stop-color="#00A3FF"/>
                                <stop offset="100%" stop-color="#FFFFFF"/>
                            </linearGradient>
                            <filter id="navGaugeShadow" x="-30%" y="-30%" width="160%" height="160%">
                                <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#0066FF" flood-opacity="0.18"/>
                            </filter>
                            <filter id="navNeedleGlow" x="-50%" y="-50%" width="200%" height="200%">
                                <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00D2FF" flood-opacity="0.70"/>
                            </filter>
                        </defs>
                        <g filter="url(#navGaugeShadow)">
                            <path d="M 40.79 126.22 A 82 82 0 0 1 63.04 46.01 L 78.32 61.84 A 60 60 0 0 0 62.04 120.53 Z" fill="url(#navGradLeft)"/>
                            <path d="M 69.52 40.38 A 82 82 0 0 1 170.48 40.38 L 156.94 57.72 A 60 60 0 0 0 83.06 57.72 Z" fill="url(#navGradMid)"/>
                            <path d="M 176.96 46.01 A 82 82 0 0 1 199.21 126.22 L 177.96 120.53 A 60 60 0 0 0 161.68 61.84 Z" fill="url(#navGradRight)"/>
                        </g>
                        <g class="egs-needle-group" filter="url(#navNeedleGlow)">
                            <animateTransform
                                attributeName="transform"
                                type="rotate"
                                values="-50 120 105; 38 120 105; 10 120 105; 42 120 105; -15 120 105; 25 120 105; -50 120 105"
                                keyTimes="0; 0.22; 0.36; 0.54; 0.70; 0.86; 1"
                                dur="3.2s"
                                repeatCount="indefinite"
                                calcMode="spline"
                                keySplines="0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95"
                            />
                            <polygon points="115.5,105 120,20 124.5,105" fill="url(#navNeedleGrad)"/>
                            <line x1="120" y1="102" x2="120" y2="22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
                            <circle cx="120" cy="105" r="5.5" fill="#0066FF" stroke="#FFFFFF" stroke-width="2"/>
                        </g>
                        <text x="120" y="102" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="42px" font-style="italic" letter-spacing="6px" fill="#FFFFFF" text-anchor="middle">EGS</text>
                    </svg>
                </div>
            </a>

            <!-- QUICK SERVICE CHANNELS (الخيارين في الهيدر لسهولة وسرعة الوصول) -->
            <nav class="header-channels-nav flex items-center gap-1.5 sm:gap-2" aria-label="قنوات حجز الصيانة">
                <button type="button" class="header-channel-btn btn-channel-mobile" id="headerBtnMobile" onclick="selectServiceChannel('mobile', event)" title="طلب ورشة الصيانة المتنقلة لتصلك في مكانك">
                    <i data-feather="truck" class="w-3.5 h-3.5 text-blue-400"></i>
                    <span class="channel-text">ورشة متنقلة <span class="hidden sm:inline">(بنوصل مكانك)</span></span>
                    <span class="channel-badge-hot">متاح الآن 🟢</span>
                </button>
                <button type="button" class="header-channel-btn btn-channel-branch" id="headerBtnBranch" onclick="selectServiceChannel('branch', event)" title="حجز موعد فحص وزيارة في مركز الصيانة">
                    <i data-feather="home" class="w-3.5 h-3.5 text-neutral-300"></i>
                    <span class="channel-text">الفرع <span class="hidden sm:inline">(مركز الصيانة)</span></span>
                </button>
            </nav>

            <div class="header-meta">
                <div class="status-indicator">
                    <span class="pulse-dot"></span>
                    <span>عربات الصيانة متوفرة للطلب</span>
                </div>
                
                <!-- Auth Status Button -->
                <div class="user-account-menu" id="authBtnGroup">
                    <button class="login-trigger-btn" id="authBtn" onclick="openLoginModal()" title="تسجيل الدخول / حساب جديد">
                        <i data-feather="user"></i>
                        <span id="authBtnText" class="hidden md:inline">تسجيل الدخول / حساب جديد</span>
                    </button>
                </div>


                <a href="tel:{{ site_settings.short_hotline|default:'19900' }}" class="hotline-btn" title="الخط الساخن المباشر">
                    <i data-feather="phone-call"></i>
                    <span class="hidden sm:inline">{{ site_settings.short_hotline|default:'19900' }}</span>
                </a>
            </div>
        </div>
    </header>
